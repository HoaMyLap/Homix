name: Homix v2.0 CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test-and-build:
    name: Build & Test Backend (Spring Boot 3.x)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: smart_task_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Initialize & Verify PostgreSQL 21-Table Schema
        env:
          PGPASSWORD: supersecretpassword
        run: |
          psql -h localhost -p 5432 -U admin -d smart_task_db -v ON_ERROR_STOP=1 -f init-db/schema.sql

      - name: Grant execute permission for gradlew
        run: chmod +x server/gradlew

      - name: Run Backend Unit Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/smart_task_db
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: supersecretpassword
          SPRING_DATA_REDIS_HOST: 127.0.0.1
          SPRING_DATA_REDIS_PORT: 6379
        run: |
          cd server
          ./gradlew test --info

      - name: Build Spring Boot Executable JAR
        run: |
          cd server
          ./gradlew bootJar -x test

  frontend-test-and-build:
    name: Build & Lint Frontend (Next.js 16)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm ci

      - name: Run Frontend ESLint Check
        run: |
          cd client
          npm run lint

      - name: Run Next.js Production Build
        run: |
          cd client
          npm run build
